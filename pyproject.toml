[project]
name = "vesta"
version = "0.1.0"
description = "Display equity and crypto prices on a Vestaboard"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "vestaboard>=1.0.0",
    "yfinance==0.2.54",
    "click>=8.0.0",
]

[project.scripts]
vesta = "vesta.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vesta"]
